document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t:1.5;color:var(--text-muted)\">Search field<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Filters the rail and dims every node off the matched path, live, from the first character.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:11px\"><span style=\"font-family:var(--panton);font-weight:700;font-size:14px;letter-spacing:-0.02em\">Keyboard<\u002Fspan><div style=\"border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)\"><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:9px 16px;background:var(--bg-subtle)\"><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">KEYS<\u002Fspan><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">CONTEXT<\u002Fspan><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">RESULT<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">Tab<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Anywhere<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Moves between regions, not between nodes. Four stops, in reading order.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">↑<\u002Fspan> <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">↓<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Chart or rail<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Moves through siblings. Selection follows focus.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">←<\u002Fspan> <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">→<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Chart<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Moves to the parent or the first report. Wraps at neither end.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">Enter<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">A focused node<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Opens Edit permissions.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">/<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Anywhere<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Jumps to the search field.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">1<\u002Fspan> <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">2<\u002Fspan> <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">3<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Anywhere<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Switches to chart, grid or matrix.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-muted)\">Esc<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">A modal or popover<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Closes it and returns focus to whatever opened it.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:11px\"><span style=\"font-family:var(--panton);font-weight:700;font-size:14px;letter-spacing:-0.02em\">Motion<\u002Fspan><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">Nothing animates position. The chart never slides, re-centres or re-flows on selection, because losing your place in a hierarchy is worse than a hard cut. Only colour, shadow and opacity move.<\u002Fspan><div style=\"border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)\"><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:9px 16px;background:var(--bg-subtle)\"><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">WHAT MOVES<\u002Fspan><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">TRIGGER<\u002Fspan><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">HOW<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Node border and shadow<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Hover<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">120ms, ease-out. Fast enough to feel attached to the cursor.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Selection ring<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Click<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">120ms, ease-out, colour only. The ring fades in; the node does not scale.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Inspector content<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Selection change<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">No transition. An instant swap, so the counts can never be read mid-fade and misread.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Dimmed nodes<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Search<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">160ms opacity to 0.38. Slow enough to see which branch survived.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Branch expand<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Stub click<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">200ms height, ease-out, on the new rows only. Existing nodes hold position.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Modal<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Button<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">140ms opacity and 4px rise. No scale, no bounce.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Coverage meters<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">First paint<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">400ms width from zero, ease-out, staggered 40ms. Once, on load only, never on re-render.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 170px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">All of the above<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Reduced motion<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Every duration drops to zero. Nothing is lost, because no motion carries meaning.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"display:flex;flex-direction:column;gap:26px\"><div id=\"scaling\" style=\"display:flex;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--border-emphasis);scroll-margin-top:90px\"><h2 style=\"margin:0;font-family:var(--panton);font-weight:800;font-size:24px;letter-spacing:-0.03em\">Scaling<\u002Fh2><span style=\"font-size:13px;color:var(--text-subtle);flex:1\">How the screen behaves as the window changes, how the chart handles a tree bigger than its region, and how this page shows it.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:22px\"><div style=\"display:flex;flex-direction:column;gap:11px\"><span style=\"font-family:var(--panton);font-weight:700;font-size:14px;letter-spacing:-0.02em\">The screen itself<\u002Fspan><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">Three regions are fixed and one is fluid. Nothing scales typographically at any width, because a permissions screen that shrinks its own type stops being readable before it stops fitting.<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border-emphasis);border-radius:var(--r-md)\"><div style=\"flex:none;width:104px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)\">1560+<\u002Fspan><span style=\"font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--text-subtle)\">DESIGNED FOR<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">All four regions at their designed widths. The canvas takes the surplus and the chart sits centred within it.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)\"><div style=\"flex:none;width:104px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text)\">1280 to 1560<\u002Fspan><span style=\"font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--text-subtle)\">COMFORTABLE<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">The canvas narrows to about 460px and the chart pans inside its own region. No region changes width.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)\"><div style=\"flex:none;width:104px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text)\">1024 to 1280<\u002Fspan><span style=\"font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--text-subtle)\">TIGHT<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">The role rail collapses to a 56px icon strip with the division colours only. Hovering it slides the full rail over the canvas.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)\"><div style=\"flex:none;width:104px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text)\">Below 1024<\u002Fspan><span style=\"font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--text-subtle)\">STACKED<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">The inspector leaves the side and becomes a sheet over the bottom half. Chart above, detail below, which is the only arrangement that keeps both usable.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:11px\"><span style=\"font-family:var(--panton);font-weight:700;font-size:14px;letter-spacing:-0.02em\">The chart inside it<\u002Fspan><div style=\"border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)\"><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:9px 16px;background:var(--bg-subtle)\"><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">BEHAVIOUR<\u002Fspan><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-subtle)\">RULE<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Intrinsic sizing<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Every node is a fixed width and every branch shrink-wraps its subtree, so a node can never be squeezed narrower than its content. The tree asks for the width it needs.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Overflow becomes pan<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Where the canvas is narrower than the tree, the region scrolls on both axes. It is never clipped, and the minimap shows where you are.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Zoom is separate<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Ctrl and scroll, or the zoom control, between 50 and 150 per cent. Manual only. The chart never auto-fits on selection, because that moves the ground under you.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Fit is a button<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">\"Fit\" sets the zoom so the whole tree is visible once. It is a deliberate action, not a reaction to the window.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 16px;border-top:1px solid var(--border)\"><span style=\"font-size:12px;line-height:1.5;color:var(--text);font-weight:500\">Depth over width<\u002Fspan><span style=\"font-size:12px;line-height:1.5;color:var(--text-muted)\">Past 30 roles, branches deeper than three levels collapse to a stub rather than the chart growing without limit. The grid view carries completeness.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:11px\"><span style=\"font-family:var(--panton);font-weight:700;font-size:14px;letter-spacing:-0.02em\">This page<\u002Fspan><span style=\"font-size:12.5px;color:var(--text-muted);line-height:1.55\">Section 01 shows the screen at its real 1560px with no scaling at all, and runs full-bleed past this column so it gets your whole window. If your window is narrower, the figure scrolls sideways and says so. An earlier version scaled it down to fit, which put 9px labels at under 5px, so scaling is gone entirely.<\u002Fspan><div style=\"display:flex;align-items:center;gap:14px;background:var(--bg-subtle);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:13px 17px\"><span style=\"font-size:12.5px;line-height:1.5;color:var(--text-muted)\">The rule the mock enforces: an element with hidden overflow may never be smaller than its content. The page checks that on load and on resize, and converts any shortfall to a scroll rather than a silent cut.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><div style=\"display:flex;justify-content:space-between;align-items:center;padding-top:26px;border-top:1px solid var(--border)\"><a href=\"STC%20UI%20Kit.dc.html\" style=\"font-size:12.5px;color:var(--text-subtle)\" style-hover=\"color:var(--accent)\">All sections<\u002Fa><a href=\"STC%20UI%20Roles%20Screen.dc.html\" style=\"display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 18px;background:var(--primary);color:var(--primary-fg);border-radius:var(--r);font-size:13px;font-weight:600\" style-hover=\"background:var(--primary-hover)\">← Back to the screen <span style=\"font-family:var(--panton);font-weight:800\">›<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fmain><\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { theme: 'light' };\n  componentDidMount() {\n    let t = null; try { t = localStorage.getItem('stc-ui-theme'); } catch (e) {}\n    const next = t === 'dark' || t === 'light' ? t : 'light';\n    this.setState({ theme: next });\n    document.documentElement.setAttribute('data-stc-theme', next);\n  }\n  componentDidUpdate() { document.documentElement.setAttribute('data-stc-theme', this.state.theme); }\n  renderVals() {\n    return {\n      themeLabel: this.state.theme === 'dark' ? 'Dark' : 'Light',\n      toggleTheme: () => this.setState(s => {\n        const theme = s.theme === 'dark' ? 'light' : 'dark';\n        try { localStorage.setItem('stc-ui-theme', theme); } catch (e) {}\n        return { theme };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
